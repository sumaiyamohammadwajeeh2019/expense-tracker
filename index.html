<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Expense Tracker</title>
  <link rel="stylesheet" href="style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
  <div class="app">
    <header class="app-header">
      <h1>💰 Expense Tracker</h1>
      <p class="subtitle">Made by Dr. Sumaiya Mohammad</p>
      <div id="connectionStatus" class="status status-offline">Connecting...</div>
    </header>

    <!-- Summary Cards -->
    <section class="summary">
      <div class="card income">
        <span class="card-label">Total Income</span>
        <span class="card-value" id="totalIncome">৳0.00</span>
      </div>
      <div class="card expense">
        <span class="card-label">Total Expense</span>
        <span class="card-value" id="totalExpense">৳0.00</span>
      </div>
      <div class="card balance">
        <span class="card-label">Balance</span>
        <span class="card-value" id="totalBalance">৳0.00</span>
      </div>
    </section>

    <!-- Monthly Category Breakdown -->
    <section class="panel breakdown-panel">
      <div class="breakdown-header">
        <h2>📊 Monthly Expenses by Category</h2>
        <input type="month" id="breakdownMonth" title="Select month">
      </div>
      <div id="categoryBreakdownBody"></div>
      <div id="breakdownTotal" class="breakdown-total"></div>
    </section>

    <div class="main-grid">
      <!-- Form -->
      <section class="panel">
        <h2 id="formTitle">Add Transaction</h2>
        <form id="expenseForm">
          <input type="hidden" id="expenseId">
          <div class="field">
            <label for="date">Date</label>
            <input type="date" id="date" required>
          </div>
          <div class="field">
            <label for="type">Type</label>
            <select id="type" required>
              <option value="Expense">Expense</option>
              <option value="Income">Income</option>
            </select>
          </div>
          <div class="field">
            <label for="category">Category</label>
            <select id="category" required>
              <option value="Food">Food</option>
              <option value="Transport">Transport</option>
              <option value="Shopping">Shopping</option>
              <option value="Bills">Bills</option>
              <option value="Entertainment">Entertainment</option>
              <option value="Health">Health</option>
              <option value="Education">Education</option>
              <option value="Salary">Salary</option>
              <option value="Other">Other</option>
            </select>
          </div>
          <div class="field">
            <label for="description">Description</label>
            <input type="text" id="description" placeholder="e.g. Lunch with team" maxlength="100">
          </div>
          <div class="field">
            <label for="amount">Amount</label>
            <input type="number" id="amount" placeholder="0.00" step="0.01" min="0.01" required>
          </div>
          <div class="btn-row">
            <button type="submit" class="btn primary" id="submitBtn">Add Transaction</button>
            <button type="button" class="btn ghost" id="cancelEditBtn" hidden>Cancel Edit</button>
          </div>
        </form>
      </section>

      <!-- List -->
      <section class="panel">
        <h2>Transactions</h2>
        <div class="filters">
          <input type="text" id="searchInput" placeholder="🔍 Search description / category">
          <select id="filterType">
            <option value="all">All types</option>
            <option value="Income">Income</option>
            <option value="Expense">Expense</option>
          </select>
          <input type="date" id="filterFrom" title="From date">
          <input type="date" id="filterTo" title="To date">
          <button type="button" class="btn ghost small" id="clearFiltersBtn">Clear</button>
        </div>

        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>Date</th>
                <th>Type</th>
                <th>Category</th>
                <th>Description</th>
                <th class="right">Amount</th>
                <th class="right">Actions</th>
              </tr>
            </thead>
            <tbody id="expenseTableBody">
              <tr><td colspan="6" class="empty">Loading...</td></tr>
            </tbody>
          </table>
        </div>
        <div class="btn-row">
          <button type="button" class="btn secondary" id="refreshBtn">↻ Refresh from Google Sheets</button>
        </div>
      </section>
    </div>

    <footer class="app-footer">
      <span id="recordCount">0 records</span> • Data stored in Google Sheets
    </footer>
  </div>

  <div id="toast" class="toast"></div>

  <script src="script.js"></script>
</body>
</html>
